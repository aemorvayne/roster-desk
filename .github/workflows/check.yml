name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5.2.1
      - uses: browser-actions/setup-chrome@v2.2.0
      - run: mise run setup
      - run: mise run pg-start
      - run: RAILS_ENV=test mise run db
      - run: mise run check
      - run: mise run pg-stop
        if: always()
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - run: docker build -t roster-desk .
      - run: docker run --detach --name roster-desk --network host --env DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/roster_desk --env SECRET_KEY_BASE="$(openssl rand -hex 64)" roster-desk
      - run: curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://localhost:10000/session/new
      - run: curl --fail --silent --show-error --output /dev/null http://localhost:10000/vendor/bootstrap.min.css
      - run: docker logs roster-desk
        if: always()
      - run: docker rm --force roster-desk
        if: always()
