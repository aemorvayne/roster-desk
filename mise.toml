[tools]
ruby = "4.0.7"
node = "24.22.0"
postgres = "18.6"
gitleaks = "8.30.1"

[tasks.setup]
run = ["\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb bundle install", "\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb npm ci", "git config core.hooksPath .githooks"]

[tasks.privacy-staged]
run = "gitleaks git --staged --redact --no-banner --ignore-gitleaks-allow ."

[tasks.privacy]
run = ["gitleaks git --log-opts=--all --redact --no-banner --ignore-gitleaks-allow .", "mise run privacy-staged"]

[tasks.test]
run = "\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb bundle exec ruby -r./test/coverage_start.rb -S rake verify"

[tasks.lint]
run = ["\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb bundle exec rubocop --lint", "\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb npm run lint"]

[tasks.format-check]
run = ["\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb bundle exec rubocop --except Lint", "\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb npm run format-check"]

[tasks.format]
run = ["\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb bundle exec rubocop --autocorrect --except Lint", "\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb npm run format"]

[tasks.check]
depends = ["lint", "format-check", "test", "privacy"]

[tasks.dev]
run = "\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb bundle exec puma -C config/puma.rb"

[tasks.db]
run = "\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb bundle exec ruby bin/rails db:prepare"

[tasks.pg-init]
run = "test -d tmp/postgres || initdb --pgdata=tmp/postgres --username=postgres --auth=trust --no-locale --encoding=UTF8"

[tasks.pg-start]
depends = ["pg-init"]
run = "pg_ctl -D tmp/postgres status || pg_ctl -D tmp/postgres -l tmp/postgres.log -o '-h 127.0.0.1 -p 55434' start"

[tasks.pg-stop]
run = "pg_ctl -D tmp/postgres stop"

[tasks.import]
run = "\"{{ tools.ruby.path }}/bin/ruby\" bin/run.rb bundle exec rake import"
