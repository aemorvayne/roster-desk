services:
  - type: web
    name: roster-desk
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    healthCheckPath: /session/new
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roster-desk-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini

databases:
  - name: roster-desk-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
    ipAllowList: []
